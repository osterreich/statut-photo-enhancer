version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - 'test -n "$S3_REGION" || { echo "Missing Amplify env S3_REGION"; exit 1; }'
        - 'test -n "$S3_BUCKET_NAME" || { echo "Missing Amplify env S3_BUCKET_NAME"; exit 1; }'
        - env | grep -E '^(S3_REGION|S3_BUCKET_NAME)=' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
